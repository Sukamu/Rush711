<style>

#box i:nth-child(2){right:-3px;top:-3px;border-left:0;border-bottom:0}
#box i:nth-child(3){left:-3px;bottom:-3px;border-right:0;border-top:0}

<div id="stage">
  <div id="empty">

  </div>

  <div class="b"><button class="ok" id="dl">Télécharger</button><button id="share">Partager</button><button id="close">Fermer</button></div>
</div>
<div id="toast" role="status"></div>

/* Zoom et déplacement */

}

/* Copie de style : on ajuste les curseurs pour que les tons et couleurs se rapprochent de la référence */
var SM=null;
function samp(o){
 var n=64,c=document.createElement("canvas");c.width=n;c.height=n;var x=c.getContext("2d");x.drawImage(o,0,0,n,n);

 for(var i=0,j=0;i<d.length;i+=4,j+=3){a[j]=d[i]/255;a[j+1]=d[i+1]/255;a[j+2]=d[i+2]/255}

}
function adj(lin,p){
 var o=new Float32Array(lin.length),ex=Math.pow(2,p.e),ig=1/2.2,pw=Math.pow;
 for(var i=0;i<lin.length;i+=3){
  var r=lin[i]*ex,g=lin[i+1]*ex,b=lin[i+2]*ex;
  r*=(1+p.t*.3)*(1+p.g*.08);b*=(1-p.t*.3)*(1+p.g*.08);g*=1-p.g*.2;
  r=pw(r,ig);g=pw(g,ig);b=pw(b,ig);
  var l=.2126*r+.7152*g+.0722*b,lc=l<0?0:l>1?1:l,m=(1+p.s*.8*(1-lc)*(1-lc))*(1+p.h*.5*l*l);
  r=(r*m-.5)*(1+p.c)+.5;g=(g*m-.5)*(1+p.c)+.5;b=(b*m-.5)*(1+p.c)+.5;
  var q=.2126*r+.7152*g+.0722*b,sat=Math.max(r,g,b)-Math.min(r,g,b),f=(1+p.v*(1-sat))*(1+p.a);
  r=q+(r-q)*f;g=q+(g-q)*f;b=q+(b-q)*f;
  o[i]=r<0?0:r>1?1:r;o[i+1]=g<0?0:g>1?1:g;o[i+2]=b<0?0:b>1?1:b;
 }
 return o;
}
function stat(a){
 var n=a.length/3,L=new Float32Array(n),sat=0,mr=0,mg=0,mb=0;
 for(var i=0,j=0;j<n;i+=3,j++){
  var r=a[i],g=a[i+1],b=a[i+2];L[j]=.2126*r+.7152*g+.0722*b;
  sat+=Math.max(r,g,b)-Math.min(r,g,b);mr+=r;mg+=g;mb+=b;
 }
 L.sort();
 return [L[(n*.1)|0],L[(n*.5)|0],L[(n*.9)|0],sat/n,Math.log((mr+.01)/(mg+.01)),Math.log((mb+.01)/(mg+.01))];
}
var W=[2,2,2,1.5,1.5,1.5];
function fit(lin,tg){
 var p={};KEYS.forEach(function(k){p[k]=0});
 function loss(){
  var s=stat(adj(lin,p)),d=0,i;
  for(i=0;i<6;i++)d+=W[i]*(s[i]-tg[i])*(s[i]-tg[i]);
  KEYS.forEach(function(k){d+=.002*p[k]*p[k]});
  return d;
 }
 var best=loss();
 [.5,.25,.12,.06,.03].forEach(function(st){
  for(var pass=0;pass<2;pass++)KEYS.forEach(function(k){
   var lim=k==="e"?2:1;
   [st,-st].forEach(function(dl){
    var old=p[k],v=cl(old+dl*lim,-lim,lim);if(v===old)return;
    p[k]=v;var l2=loss();if(l2<best-1e-9)best=l2;else p[k]=old;
   });
  });
 });

}

   var p=fit(lin,tg);zero();KEYS.forEach(function(k){P[k]=Math.round(p[k]*100)/100});

/* Export en pleine résolution, sans redimensionnement */
var srcFile=null,outFmt="jpg",busy=false;
function mkGL(c){
 var g=c.getContext("webgl",{preserveDrawingBuffer:true});if(!g)return null;
 var pr=g.createProgram();
 [[g.VERTEX_SHADER,VS],[g.FRAGMENT_SHADER,FS]].forEach(function(a){var o=g.createShader(a[0]);g.shaderSource(o,a[1]);g.compileShader(o);g.attachShader(pr,o)});

 g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
 var pl=g.getAttribLocation(pr,"p");g.enableVertexAttribArray(pl);g.vertexAttribPointer(pl,2,g.FLOAT,false,0,0);
 var u={};["K","e","c","h","s","t","g","vb","a"].forEach(function(n){u[n]=g.getUniformLocation(pr,n)});
 g.bindTexture(g.TEXTURE_2D,g.createTexture());
 g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.NEAREST);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.NEAREST);
 g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
 return{g:g,u:u};
}
function exifOf(buf){
 try{
  var v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;
  var o=2;
  while(o+4<v.byteLength){
   var m=v.getUint16(o);if(m===0xFFDA||m<0xFF00)break;
   var l=v.getUint16(o+2);
   if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){
    var seg=new Uint8Array(buf.slice(o,o+2+l)),d=new DataView(seg.buffer),le=d.getUint16(10)===0x4949;
    var ifd=10+d.getUint32(14,le),n=d.getUint16(ifd,le);
    for(var i=0;i<n;i++){var e=ifd+2+i*12;if(d.getUint16(e,le)===0x0112){d.setUint16(e+8,1,le);break}}
    return seg;
   }
   o+=2+l;
  }
 }catch(x){}
 return null;
}
function untouched(){
 return KEYS.every(function(k){return P[k]===0})&&C.x===0&&C.y===0&&C.w===1&&C.h===1;
}
function toBlob(c,type,q){return new Promise(function(res){c.toBlob(res,type,q)})}
function exportFull(f){
 var isJpg=srcFile&&(srcFile.type==="image/jpeg"||/\.jpe?g$/i.test(srcFile.name||""));
 return createImageBitmap(srcFile,{imageOrientation:"from-image"}).then(function(bmp){
  var FW=bmp.width,FH=bmp.height;
  if(untouched()&&f==="jpg"&&isJpg){bmp.close&&bmp.close();return{blob:srcFile,w:FW,h:FH,note:"original inchangé"}}
  var sx=Math.round(C.x*FW),sy=Math.round(C.y*FH),w=Math.max(1,Math.min(FW-sx,Math.round(C.w*FW))),h=Math.max(1,Math.min(FH-sy,Math.round(C.h*FH)));
  var out=document.createElement("canvas");out.width=w;out.height=h;
  var oc=out.getContext("2d"),ec=document.createElement("canvas"),E=mkGL(ec);
  if(!E)throw new Error("webgl");
  var g=E.g,u=E.u,T=Math.min(2048,g.getParameter(g.MAX_TEXTURE_SIZE)),tc=document.createElement("canvas"),tx2=tc.getContext("2d");
  var tiles=[],x,y;
  for(y=0;y<h;y+=T)for(x=0;x<w;x+=T)tiles.push([x,y]);
  var i=0;
  function step(){
   if(i>=tiles.length)return Promise.resolve();
   var tx=tiles[i][0],ty=tiles[i][1],tw=Math.min(T,w-tx),th=Math.min(T,h-ty);
   tc.width=tw;tc.height=th;tx2.drawImage(bmp,sx+tx,sy+ty,tw,th,0,0,tw,th);
   ec.width=tw;ec.height=th;g.viewport(0,0,tw,th);
   g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,true);
   g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,tc);
   g.uniform4f(u.K,0,0,1,1);
   g.uniform1f(u.e,P.e);g.uniform1f(u.c,P.c);g.uniform1f(u.h,P.h);g.uniform1f(u.s,P.s);
   g.uniform1f(u.t,P.t);g.uniform1f(u.g,P.g);g.uniform1f(u.vb,P.v);g.uniform1f(u.a,P.a);
   g.drawArrays(g.TRIANGLE_STRIP,0,4);
   oc.drawImage(ec,tx,ty);
   i++;$("oinfo").textContent="Traitement en pleine résolution… "+Math.round(i/tiles.length*100)+" %";
   return new Promise(function(r){setTimeout(r,0)}).then(step);
  }
  return step().then(function(){
   bmp.close&&bmp.close();tc.width=tc.height=1;ec.width=ec.height=1;
   var ext=g.getExtension("WEBGL_lose_context");if(ext)ext.loseContext();
   return toBlob(out,f==="png"?"image/png":"image/jpeg",1);
  }).then(function(blob){
   out.width=out.height=1;
   if(!blob)throw new Error("encode");
   if(f==="png")return{blob:blob,w:w,h:h,note:"sans métadonnées"};
   if(!isJpg)return{blob:blob,w:w,h:h,note:""};
   return srcFile.slice(0,262144).arrayBuffer().then(function(hd){
    var seg=exifOf(hd);if(!seg)return{blob:blob,w:w,h:h,note:""};
    return blob.arrayBuffer().then(function(rest){
     return{blob:new Blob([new Uint8Array([0xFF,0xD8]),seg,new Uint8Array(rest,2)],{type:"image/jpeg"}),w:w,h:h,note:"EXIF conservé"};
    });
   });
  });
 });
}

  cv.toBlob(function(b){

  },"image/jpeg",0.95);

}
function runExport(){

  busy=false;showResult(r.blob,r.w+" × "+r.h+" px"+(r.note?" · "+r.note:""));
 }).catch(function(){

 });

function nat(){
 var C=window.Capacitor;if(!(C&&C.isNativePlatform&&C.isNativePlatform()))return null;
 var P=C.Plugins||{};

}
function nativeSave(){
 var N=nat();if(!N||!lastBlob)return false;
 var fr=new FileReader();
 fr.onload=function(){
  var b64=String(fr.result).split(",")[1];
  N.FS.writeFile({path:"rush711-picture-color-"+Date.now()+(outFmt==="png"?".png":".jpg"),data:b64,directory:"CACHE"})
   .then(function(r){return N.SH.share({title:"Rush711 Picture Color",files:[r.uri]})})
   .catch(function(e){toast("Partage impossible : "+((e&&e.message)||"erreur"))});
 };
 fr.readAsDataURL(lastBlob);return true;
}
$("dl").onclick=function(){
 if(!lastBlob||!blobUrl)return;if(nativeSave())return;
 var a=document.createElement("a");a.href=blobUrl;a.download="rush711-picture-color"+(outFmt==="png"?".png":".jpg");
 document.body.appendChild(a);a.click();a.remove();toast("Téléchargement lancé.");
};
$("share").onclick=function(){
 if(nativeSave())return;
 try{
  var f=new File([lastBlob],"rush711-picture-color"+(outFmt==="png"?".png":".jpg"),{type:outFmt==="png"?"image/png":"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}
 }catch(e){}
 toast("Partage indisponible ici. Appuie longuement sur l’image.");
};
buildTabs();buildPanel();
})();
